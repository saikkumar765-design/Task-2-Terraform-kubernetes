apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: authentik
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: postgres:15
              command:
                - /bin/sh
                - -c
                - pg_dump -h postgres -U authentik authentik > /backup/db.sql
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - mountPath: /backup
                  name: backup-storage
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-pvc
          restartPolicy: OnFailure
